defaults:
  - config_schema
  - _self_
  - policy: alpamayo
  - reward: distance_to_gt
  - transport: disk
  - topology: ???
  - optional run: null
  - optional experiment: null
  # Override with deploy=slurm to submit a Slurm job, and provide the
  # site-specific partition/account/container image values as config overrides.
  - deploy: local

run_root: ./tmp/alpagym-runs

logging_level: INFO

# Optional root for deployment-owned writable caches.
cache_root_dir: null

execution:
  # The topology preset selects the backend (local_process or slurm); the deploy
  # preset fills the site settings (partition/account/image/caches) below.
  backend: ???
  # Formal humanoid experiments override this to `required`. The lifecycle then
  # refuses to launch Cosmos without immutable source and live-runtime receipts.
  provenance_mode: disabled
  # Set only when executing a run that was already prepared and written to disk.
  # Leave null for command=run to prepare a new run from this Hydra config.
  resolved_config_path: null
  slurm:
    job_name: alpagym
    partition: null
    account: null
    time: "02:00:00"
    nodes: 1
    gpus_per_node: 8
    exclusive: true
    cpus_per_task: 16
    # Set mem to "0" to request all memory on an allocated node.
    mem: null
    container_image: null
    container_cache_root: null
    # The host-side AlpaGym checkout path, mounted identically into the container
    # (the deploy preset mounts the filesystem that holds it). Cosmos runs
    # `uv sync --project` and launches from here.
    container_workdir: ${current_alpagym_project_root:}

# Per-episode step budget the trainer's packer pads every rollout to.
expected_valid_steps: 8

dataset:
  test_suite_id: null
  # test_suite_id: public_2507
  scene_ids:
    - clipgt-01d503d4-449b-46fc-8d78-9085e70d3554
    - clipgt-37113280-a033-4be4-afdd-cb199299e028
    # - clipgt-35b7b92a-b64d-4b54-afbb-d23f0b4df598
    # - clipgt-2f474f6d-509a-483e-ad4d-43fee7b4fb06

alpasim:
  # Selects the AlpaSim runtime domain: av uses EgodriverService; humanoid uses
  # HumanoidPolicyService + HumanoidDynamicsService.
  simulation_domain: av
  # Non-null only for the G1/MJLab domain. Experiment presets fill the
  # portable task parameters; machine-specific paths remain explicit inputs.
  humanoid: null
  # Set repo_path to use an existing checkout directly. When set, AlpaGym skips
  # clone/fetch/checkout/sync and starts Wizard from this path.
  repo_path: null
  # Optional directory for cached AlpaSim checkouts. Defaults to XDG_CACHE_HOME.
  checkout_cache_dir: null
  # AlpaSim fork containing the exact humanoid gRPC/runtime ABI pinned by this
  # workspace. Set repo_path to start Wizard from a local checkout instead.
  repo_url: https://github.com/chenyx09/alpasim.git
  repo_ref: ${alpasim_grpc_repo_ref:}
  startup_timeout_s: 1200.0
  simulation_timeout_s: 600.0
  # The AlpaSim worker expires first; the remaining wall-clock minute is
  # reserved for cancellation, FINALIZE/session-close, and the RPC response.
  runtime_rollout_timeout_s: 540.0
  simulation_cleanup_margin_s: 60.0
  wizard_args:
    topology: 1gpu
    driver: null
    driver_source: external_dynamic
    force_gt_duration_us: 1_700_000
    control_timestep_us: 100_000
    # Derive n_sim_steps so each rollout yields expected_valid_steps closed-loop
    # policy steps: the policy runs only after the force-GT warmup, so
    # n_sim_steps = expected_valid_steps + warmup steps.
    n_sim_steps: "${add:${expected_valid_steps},${floordiv:${alpasim.wizard_args.force_gt_duration_us},${alpasim.wizard_args.control_timestep_us}}}"
    # Free-form sink for any other Hydra-style wizard overrides. Promote
    # anything we set unconditionally to a dedicated `wizard_args` field;
    # use this only for one-off / experimental tweaks.
    extra_overrides: ""

perf:
  enabled: false
  # reservoir sampling stride for timing
  sample_every_n: 1
  # null disables the periodic monitor
  resource_sample_interval_s: 5.0
  # per-series reservoir cap (percentiles)
  max_samples_per_series: 1000
  # count trigger for a background flush
  flush_every_n_updates: 1000
  # time trigger for a background flush
  flush_interval_s: 60.0
  collect_cpu: true
  collect_gpu: true

cosmos:
  mode: colocated
  launch:
    policy_replicas: 1
    rollout_replicas: 1
    controller_port: 29500
  train:
    # Explicitly serialized into cosmos_config.toml so formal runs can attest
    # the step-N -> step-(N+1) on-policy weight-sync contract.
    sync_weight_interval: 1
    train_batch_per_replica: 1
    max_num_steps: 1
    num_epochs: 1
    # Seed model initialization, minibatch ordering, and trainer-side sampling.
    # Formal experiments also enable deterministic kernels in their profile.
    seed: 42
    deterministic: false
    optm_lr: 1.0e-6
    # Optional per-model-part learning rates. When non-empty, generated Cosmos
    # config uses this list as train.optm_lr instead of the scalar above.
    optm_part_lrs: []
    epsilon: 1.0e-6
    optm_weight_decay: 0.01
    optm_betas: [0.9, 0.999]
    optm_grad_norm_clip: 1.0
    # Linear warmup steps for the learning rate (Cosmos-RL default: 20).
    optm_warmup_steps: 20
    # Native Cosmos resume is disabled unless every identity field below is
    # supplied. The path is the exact
    # `<prior-run>/cosmos/<timestamp>/checkpoints/step_N/policy` directory.
    # Host and trainer validation bind it to a completed valid formal run and
    # reject any load failure instead of falling back to base/HF weights.
    resume:
      enabled: false
      prior_formal_run_id: null
      checkpoint_step: null
      checkpoint_path: null
      checkpoint_tree_sha256: null
      prior_postrun_receipt_sha256: null
      expected_next_training_step: null
    # Checkpoint settings. With `enable_checkpoint: true` the cosmos resume
    # bundle is written every `save_freq` steps and always on the last step;
    # with `export_safetensors: true` an HF-compatible weight set is also
    # written. Saves land under
    # `{run_dir}/cosmos/<timestamp>/{checkpoints,safetensors}/step_N/`
    # (cosmos appends `<timestamp>` to `train.output_dir` at startup).
    ckpt:
      enable_checkpoint: true
      save_freq: 20
      save_freq_in_epoch: 0
      save_mode: sync
      export_safetensors: true
      max_keep: 5
    train_policy:
      # AlpaGym trainer registered with Cosmos-RL. Use alpagym_ppo for
      # per-step actor-critic PPO over replay payloads.
      trainer_type: alpagym_grpo
      allowed_outdated_steps: 4
      on_policy: false
      mini_batch: 1
      # PPO/GRPO ratio clipping. The trajectory probability ratio is clipped
      # to [1 - grpo_ratio_clip_low, 1 + grpo_ratio_clip_high].
      grpo_ratio_clip_low: 0.2
      grpo_ratio_clip_high: 0.2
      # Number of PPO/GRPO optimization passes over each collected rollout
      # group; total updates per group are this value * num_mini_batches.
      grpo_optimization_iterations: 1
      # Optional KL penalty against a reference model. 0 disables the penalty.
      kl_beta: 0.0
      # Trainer steps between reference-model refreshes when KL is enabled.
      # 0 means the reference model is not refreshed.
      reference_reset_interval: 0
      # PPO-only value-function settings. Ignored by alpagym_grpo.
      ppo_value_loss_coef: 0.5
      ppo_value_clip_range: null
      # Optional Flow-PPO refinements. Generic Gaussian PPO keeps both disabled.
      ppo_dual_clip_ratio: null
      ppo_value_huber_delta: null
      ppo_normalize_advantages: true
      ppo_gamma: 0.99
      ppo_gae_lambda: 0.95
      # Clamp learned Gaussian exploration after every optimizer step.
      ppo_min_action_std: 0.02
      ppo_max_action_std: 2.0
      # Optional pre/post-update KL target against the replay behavior policy.
      # This does not anchor training to the initial checkpoint. Hard mode
      # preserves the legacy acceptance gate; soft mode requires a distinct
      # catastrophic limit above the target.
      ppo_target_behavior_kl: null
      ppo_behavior_kl_target_mode: hard
      ppo_behavior_kl_hard_limit: null
      # Optional Flow-PPO actor-step backtracking. Each retry reduces the
      # candidate actor step using margin as a conservative scale factor.
      ppo_behavior_kl_backtrack: false
      ppo_behavior_kl_backtrack_margin: 0.9
      ppo_behavior_kl_backtrack_max_attempts: 4
      # Flattened transition rows per PPO forward/backward microbatch,
      # independent from rollout/shard mini_batch above.
      step_mini_batch: null
  policy:
    parallelism:
      tp_size: 1
      cp_size: 1
      ep_size: 1
      dp_shard_size: 1
      pp_size: 1
      pp_micro_batch_size: 1
      dp_replicate_size: 1
  rollout:
    n_generation: 1
    batch_size: 1
    # Run cosmos-rl's _prefetch_loop so the streaming rollout backend can
    # start the next batch's simulate(1) calls before the current batch's
    # rollout_generation returns. Requires dp_shard_size == 1.
    prefetch_rollout: true
    parallelism:
      tp_size: 1
      pp_size: 1
  logging:
    # Add `wandb` to enable Weights & Biases logging.
    logger: [console]
    log_training_metrics_every_n_steps: 1
    project_name: alpagym
    experiment_name: alpagym_default_exp
