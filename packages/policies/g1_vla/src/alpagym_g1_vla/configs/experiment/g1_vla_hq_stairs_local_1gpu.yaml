# @package _global_

defaults:
  - override /policy: g1_vla
  - override /topology: local_colocated_1gpu

# One-GPU colocated Flow-PPO rollout with a one-second H50 buffer.
expected_valid_steps: 30

dataset:
  test_suite_id: null
  scene_ids: [hq_stairs]

policy:
  model:
    path: ???

alpasim:
  simulation_domain: humanoid
  humanoid:
    repo_path: ???
    scene_store_path: ???
    scenario_ids_by_scene:
      hq_stairs: ascend
    execution_profile: motion_reference
    reference_frame_count: 50
    grail_root_path: ???
    policy_camera_profile: vla_d455
    scene_cache_path: ???
    num_envs: 1
    rollout_seed_base: 292285
    # The base humanoid image omits Open3D/Embree/gsplat/MuJoCo-Warp.  Use a
    # dependency-complete combined runtime+dynamics image for the local profile.
    service_image: alpasim-humanoid-nurec:local
    reward_profile_id: reference_route_centered.v3
    route_center_soft_m: 0.10
    route_progress_credit_m: 0.30
    route_corridor_half_width_m: 0.45
  wizard_args:
    force_gt_duration_us: 0
    # Native VLA starts the next inference after 0.5 s.  The active H50
    # buffer remains owned by the controller until its atomic replacement.
    control_timestep_us: 500_000
    n_sim_steps: 30

cosmos:
  train:
    max_num_steps: 1
    num_epochs: 1
    optm_lr: 5.0e-6
    # Cosmos applies these to separate_model_parts(): action head, then critic.
    optm_part_lrs: [5.0e-6, 1.0e-4]
    optm_warmup_steps: 0
    epsilon: 1.0e-8
    optm_weight_decay: 0.01
    optm_betas: [0.9, 0.999]
    optm_grad_norm_clip: 1.0
    # VLA's current export loader is content-attested against the original
    # source bundle and is not a standalone Hugging Face checkpoint.
    ckpt:
      export_safetensors: false
    train_policy:
      trainer_type: alpagym_flow_ppo
      mini_batch: 1
      step_mini_batch: 30
      # These legacy field names belong to Cosmos's shared trainer schema;
      # trainer_type selects Flow-PPO, not a group-relative GRPO objective.
      grpo_optimization_iterations: 1
      kl_beta: 0.0
      reference_reset_interval: 0
      ppo_gamma: 0.99
      ppo_gae_lambda: 0.95
      grpo_ratio_clip_low: 0.2
      grpo_ratio_clip_high: 0.28
      ppo_dual_clip_ratio: 3.0
      ppo_value_loss_coef: 1.0
      ppo_value_clip_range: 0.2
      ppo_value_huber_delta: 10.0
      ppo_normalize_advantages: true
  rollout:
    n_generation: 1
    batch_size: 1
    prefetch_rollout: false
