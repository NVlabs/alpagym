# @package _global_

defaults:
  - override /policy: g1_vla
  - override /topology: local_colocated_1gpu

# One-GPU colocated Flow-PPO rollout with a one-second H50 buffer.
expected_valid_steps: 60

execution:
  provenance_mode: required

dataset:
  test_suite_id: null
  scene_ids: [hq_stairs]

policy:
  model:
    path: ???

alpasim:
  simulation_domain: humanoid
  # A cold 30 s visual-SONIC episode can take ~12 wall-clock minutes on one
  # GPU.  Keep the runtime's deterministic timeout below the host gRPC
  # deadline, with a full minute for bounded teardown and response delivery.
  runtime_rollout_timeout_s: 1200.0
  simulation_cleanup_margin_s: 60.0
  simulation_timeout_s: 1260.0
  humanoid:
    repo_path: ???
    scene_store_path: ???
    scenario_ids_by_scene:
      hq_stairs: ascend
    execution_profile: motion_reference
    reference_frame_count: 50
    grail_root_path: ???
    reference_controller_profile: sonic_visual
    visual_controller_release_path: ???
    # This checkpoint's successful teacher episode was generated against the
    # Isaac-training cylinder plant.  Do not substitute the visual release's
    # standalone capsule qualification plant.
    robot_physics_profile: sonic.isaac_training.g1_cylinder_model_12.mujoco_port.v1
    policy_camera_profile: vla_d435_native
    scene_cache_path: ???
    # Mutable Torch/Warp/native build caches live outside the immutable scene
    # cache and all provenance-owned repositories/assets.
    runtime_cache_path: ???
    num_envs: 1
    rollout_seed_base: 292285
    # ckpt1500 in-distribution qualification start. This changes only the
    # runtime reset x/y/yaw; route and support z remain owned by scene `ascend`.
    runtime_spawn_root_x_m: 0.9954772324738195
    runtime_spawn_root_y_m: 2.8733132015389695
    runtime_spawn_root_yaw_rad: -0.7295696089600734
    # The base humanoid image omits Open3D/Embree/gsplat/MuJoCo-Warp.  Use a
    # dependency-complete combined runtime+dynamics image for the local profile.
    service_image: alpasim-humanoid-nurec:local
    # Controller-independent task reward over realized route progress and
    # contact-certified foot support. The checkpoint does not embed a reward hash.
    reward_profile_id: stable_support_route.v2
  wizard_args:
    force_gt_duration_us: 0
    # Match the native evaluator's action_exec_horizon=15: one policy decision
    # owns 0.5 s = 25 Visual Sonic controller ticks.
    control_timestep_us: 500_000
    n_sim_steps: 60

cosmos:
  train:
    train_batch_per_replica: 4
    max_num_steps: 1
    num_epochs: 1
    # The critic is initialized with the trainer RNG before its first rollout.
    # Pin both the RNG and deterministic kernels so LR/reward comparisons share
    # the same initial value function and minibatch order.
    seed: 20260822
    deterministic: true
    # Real replay calibration places 2.5e-9 near the 0.003 behavior-KL trust
    # region; actor-step backtracking supplies the hard bound across batches.
    optm_lr: 2.5e-9
    # Cosmos applies these to separate_model_parts(): action head, then critic.
    optm_part_lrs: [2.5e-9, 1.0e-4]
    optm_warmup_steps: 0
    epsilon: 1.0e-8
    optm_weight_decay: 0.01
    optm_betas: [0.9, 0.999]
    optm_grad_norm_clip: 1.0
    # Save portable, content-addressed trainable overlays alongside Cosmos's
    # optimizer/resume checkpoints.  The single-GPU cycle stops for frozen dev
    # qualification every five updates, so every boundary must be loadable and
    # all ten boundaries plus the initial/final safety margin are retained.
    ckpt:
      enable_checkpoint: true
      save_freq: 5
      save_mode: sync
      export_safetensors: true
      max_keep: 11
    train_policy:
      trainer_type: alpagym_flow_ppo
      allowed_outdated_steps: 0
      on_policy: true
      mini_batch: 1
      # Rollout samples one VLA decision at a time. The complete 30x38 Flow-SDE
      # chunk density is batch-kernel sensitive, so replay each transition at
      # B=1 to keep the pre-update importance ratio exactly one. Gradients from
      # every real transition are still accumulated into one optimizer step.
      step_mini_batch: 1
      # These legacy field names belong to Cosmos's shared trainer schema;
      # trainer_type selects Flow-PPO, not a group-relative GRPO objective.
      grpo_optimization_iterations: 1
      kl_beta: 0.0
      reference_reset_interval: 0
      ppo_gamma: 0.99
      ppo_gae_lambda: 0.95
      grpo_ratio_clip_low: 0.2
      grpo_ratio_clip_high: 0.28
      ppo_dual_clip_ratio: 3.0
      ppo_value_loss_coef: 1.0
      ppo_value_clip_range: 0.2
      ppo_value_huber_delta: 10.0
      ppo_normalize_advantages: true
      # Keep every accepted actor update within the measured behavior-policy
      # trust region; retry an oversized step instead of publishing it.
      ppo_target_behavior_kl: 0.003
      ppo_behavior_kl_backtrack: true
      ppo_behavior_kl_backtrack_margin: 0.9
      ppo_behavior_kl_backtrack_max_attempts: 4
  rollout:
    n_generation: 4
    batch_size: 1
    prefetch_rollout: false
