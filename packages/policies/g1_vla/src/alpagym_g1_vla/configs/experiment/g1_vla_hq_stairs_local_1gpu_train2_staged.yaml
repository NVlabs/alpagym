# @package _global_

defaults:
  - g1_vla_hq_stairs_local_1gpu
  - _self_

# Two rollout episodes form each colocated policy update. Fifty epochs author
# one 100-episode / 50-update logical horizon. Run the first process stage to
# cumulative step 5; later stages set max_num_steps to 10, 15, ..., 50 and
# resume from the exact native checkpoint at the preceding boundary.
cosmos:
  train:
    train_batch_per_replica: 2
    max_num_steps: 5
    num_epochs: 50
    ckpt:
      save_freq: 5
    train_policy:
      # Phase-A reward probing treats 0.003 as telemetry only. Every finite KL
      # publishes the single PPO update unchanged; ratio/gradient clipping are
      # the update controls. Non-finite diagnostics still fail closed.
      ppo_target_behavior_kl: 0.003
      ppo_behavior_kl_target_mode: warn
      ppo_behavior_kl_hard_limit: null
      ppo_behavior_kl_backtrack: false
  rollout:
    n_generation: 2

alpasim:
  humanoid:
    # The complete 50-update experiment consumes 100 consecutive seeds from
    # this base. Native resume restores the logical sample cursor; later
    # process stages must keep this original value unchanged.
    rollout_seed_base: 202608240100000
