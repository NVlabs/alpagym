# @package policy
kind: humanoid

model:
  kind: g1_vla
  # Exact attested model root under alpa_policy_eval/models/.
  path: ???
  device: cuda
  dtype: bfloat16
  use_cameras: [vla_d435_policy_rgb]
  # Native D435 JPEG95 transport. The checkpoint transform then applies its
  # exact NEAREST 640x480 -> 224x224 eval resize (without letterboxing).
  input_size: [480, 640]
  num_context_frames: 1
  num_historical_waypoints: 1
  num_future_waypoints: 30
  step_dt_us: 500_000
  bundle_config:
    humanoid_policy_factory: alpagym_g1_vla.humanoid_policy:build_humanoid_policy_factory
    require_policy_camera: true
    sampling_mode: flow_sde_training
    expected_schedule_sha256: d01fcb068a81712b78f9b72ff95877e332ae03245a2d1aba518c83354cf7ad12
    expected_flow_noise_level: 0.4
    expected_flow_ignore_last: true
    humanoid_vla_reference_adapter_sha256: dbcfb1d9ff4f01208c32ae6ebba051cfe6acbf3c42f6dc759e82f6d21f4116a5
    humanoid_motion_reference_sha256: caf5be258a06cadfd251178555b16ec1b4a910652fd0c135502d993b9b7e3a50
    language_instruction: walk ahead.
    camera_logical_id: vla_d435_policy_rgb
    camera_image_format: jpeg
    camera_contract_sha256: dc01fdaaac67036fb69044ea8ff66fb554131dc89bd708a66b8b955c3471a297

inference:
  # Humanoid callbacks obtain the leased actor directly; AV batching is unused.
  max_batch_size: 1
  return_trace_for_rl: true
  sampling:
    top_p: 1.0
    top_k: null
    temperature: 1.0
    num_traj_samples: 1
    num_traj_sets: 1
    max_generation_length: null
    force_determinism: false
    retry_on_nonfinite: false
    diffusion_kwargs:
      int_method: sde
      noise_level: 0.4
      inference_step: 10
      temperature: null

trajectory_selector: identity
