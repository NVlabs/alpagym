# @package _global_

defaults:
  - override /policy: g1_videomimic_planner
  - override /topology: local_colocated_1gpu

# The current VideoMimic actor autoregressively generates every action in H70
# inside the private MuJoCo rollout. GRAIL executes K25 while consuming the
# complete 45-frame future window. PPO retains all 69 conditional action
# log-probabilities and credits only tokens that can affect the realized prefix.
policy:
  model:
    path: ???
    bundle_config:
      planner_mode: shadow_rollout
      # Training realizes and scores scratch-world falls instead of censoring
      # sampled policy failures.
      shadow_fall_reference_mode: accept_for_training

# One 30-second episode: 60 outer decisions x K25 controller ticks at 50 Hz.
expected_valid_steps: 60

dataset:
  test_suite_id: null
  scene_ids: [hq_stairs]

alpasim:
  simulation_domain: humanoid
  repo_path: ???
  repo_url: null
  repo_ref: null
  humanoid:
    repo_path: ???
    scene_store_path: ???
    scenario_ids_by_scene:
      hq_stairs: ascend
    execution_profile: motion_reference
    grail_root_path: ???
    num_envs: 1
    rollout_seed_base: null
    service_image: alpasim-humanoid:local
    reward_profile_id: reference_route_centered.v3
    route_center_soft_m: 0.10
    route_progress_credit_m: 0.30
    route_corridor_half_width_m: 0.45
  wizard_args:
    force_gt_duration_us: 0
    control_timestep_us: 500_000

cosmos:
  train:
    max_num_steps: 1
    num_epochs: 1
    optm_lr: 1.0e-6
    optm_warmup_steps: 0
    ckpt:
      enable_checkpoint: true
      save_freq: 1
      save_freq_in_epoch: 0
      export_safetensors: true
      max_keep: -1
    train_policy:
      trainer_type: alpagym_ppo
      mini_batch: 1
      step_mini_batch: 60
      grpo_optimization_iterations: 1
      kl_beta: 0.1
      reference_reset_interval: 0
      ppo_gamma: 0.99
      ppo_gae_lambda: 0.95
      ppo_min_action_std: 0.05
      ppo_max_action_std: 0.15
  rollout:
    n_generation: 1
    batch_size: 1
    prefetch_rollout: false
