# @package _global_

defaults:
  - override /policy: g1_mjlab
  - override /topology: local_colocated_1gpu

expected_valid_steps: 250

dataset:
  test_suite_id: null
  scene_ids: [hq_stairs]

policy:
  model:
    path: ???

alpasim:
  simulation_domain: humanoid
  # Machine-specific paths are required CLI overrides.
  repo_path: ???
  repo_url: null
  repo_ref: null
  humanoid:
    repo_path: ???
    scene_store_path: ???
    scenario_ids_by_scene:
      hq_stairs: ascend
    num_envs: 1
    service_image: alpasim-humanoid:local
    reward_profile_id: direct_v9_shaped.v1
    route_center_soft_m: 0.10
    route_progress_credit_m: 0.30
    route_corridor_half_width_m: 0.45
  wizard_args:
    force_gt_duration_us: 0
    control_timestep_us: 20_000
    n_sim_steps: 250

cosmos:
  train:
    max_num_steps: 1
    num_epochs: 1
    optm_lr: 3.0e-5
    optm_warmup_steps: 0
    train_policy:
      trainer_type: alpagym_ppo
      mini_batch: 1
      step_mini_batch: null
      grpo_optimization_iterations: 1
      kl_beta: 0.0
  rollout:
    n_generation: 1
    batch_size: 1
    prefetch_rollout: false

