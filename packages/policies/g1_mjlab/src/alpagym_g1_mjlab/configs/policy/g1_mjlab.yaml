# @package policy
kind: humanoid

model:
  kind: g1_mjlab
  path: ???
  device: cuda
  dtype: float32
  use_cameras: []
  input_size: [1, 1]
  num_context_frames: 1
  num_historical_waypoints: 1
  num_future_waypoints: 1
  step_dt_us: 20000
  bundle_config:
    humanoid_policy_factory: alpagym_g1_mjlab.humanoid_policy:build_humanoid_policy_factory
    deterministic: false

inference:
  max_batch_size: 256
  sampling:
    top_p: 1.0
    top_k: null
    temperature: 1.0
    num_traj_samples: 1
    num_traj_sets: 1
    max_generation_length: null
    force_determinism: false
    retry_on_nonfinite: false
    diffusion_kwargs:
      int_method: sde
      noise_level: 0.0
      inference_step: 1
      temperature: null
  return_trace_for_rl: true

trajectory_selector: identity
