[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alpagym-g1-mjlab"
version = "0.1.0"
dependencies = ["alpagym-runtime", "transformers"]

[project.entry-points."alpagym.policy_bundles"]
g1_mjlab = "alpagym_g1_mjlab.bundle:get_bundle"

[project.entry-points."alpagym.configs"]
g1_mjlab = "alpagym_g1_mjlab.configs"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"alpagym_g1_mjlab.configs" = ["**/*.yaml"]
