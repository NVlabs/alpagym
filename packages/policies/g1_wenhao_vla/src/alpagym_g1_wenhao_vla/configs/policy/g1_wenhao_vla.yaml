# @package policy
kind: humanoid

model:
  kind: g1_wenhao_vla
  # Exact attested model root under alpa_policy_eval/models/.
  path: ???
  device: cuda
  dtype: bfloat16
  use_cameras: [wenhao_d455_policy_rgb]
  input_size: [140, 224]
  num_context_frames: 1
  num_historical_waypoints: 1
  num_future_waypoints: 30
  step_dt_us: 500_000
  bundle_config:
    humanoid_policy_factory: alpagym_g1_wenhao_vla.humanoid_policy:build_humanoid_policy_factory
    require_policy_camera: true
    expected_schedule_sha256: d01fcb068a81712b78f9b72ff95877e332ae03245a2d1aba518c83354cf7ad12
    expected_flow_noise_level: 0.4
    expected_flow_ignore_last: true
    humanoid_wenhao_planner_sha256: 1c27fe4960af8979e300cccbfb2148f29d89282af1658611391c6e4f4a793e9e
    humanoid_motion_reference_sha256: caf5be258a06cadfd251178555b16ec1b4a910652fd0c135502d993b9b7e3a50
    language_instruction: Walk up the stairs.
    camera_logical_id: wenhao_d455_policy_rgb
    camera_image_format: png
    camera_contract_sha256: 9709ce1b277bdb5a84127dafd93ec52ab3d2dd105ab2e084b090c633e78378e1

inference:
  # Humanoid callbacks obtain the leased actor directly; AV batching is unused.
  max_batch_size: 1
  return_trace_for_rl: true
  sampling:
    top_p: 1.0
    top_k: null
    temperature: 1.0
    num_traj_samples: 1
    num_traj_sets: 1
    max_generation_length: null
    force_determinism: false
    retry_on_nonfinite: false
    diffusion_kwargs:
      int_method: sde
      noise_level: 0.4
      inference_step: 10
      temperature: null

trajectory_selector: identity
